
name: Test Pump.fun Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      contents: read

    steps:
      - name: Get bot files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check bot files
        run: python -m py_compile bot.py scanner.py

      - name: Test scanner connection
        run: |
          python - <<'PY'
          import asyncio
          import json
          import websockets

          async def test():
              async with websockets.connect(
                  "wss://pumpportal.fun/api/data",
                  open_timeout=15
              ) as ws:
                  await ws.send(json.dumps({
                      "method": "subscribeNewToken"
                  }))
                  message = await asyncio.wait_for(
                      ws.recv(), timeout=30
                  )
                  data = json.loads(message)
                  print("PumpPortal feed responded")
                  print("Received message type:", type(data).__name__)

          asyncio.run(test())
          PY
